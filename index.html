<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首尔五天 · 随行手册（2026/9/26–9/30）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316232a'/%3E%3Cpath d='M5 19h22' stroke='%234a8a78' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M16 7l10 6H6z' fill='%234a8a78'/%3E%3Ccircle cx='11' cy='24' r='2.1' fill='%23b1403a'/%3E%3Ccircle cx='21' cy='24' r='2.1' fill='%23b8862f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16232a; --ink2:#42555d; --ink3:#71858c;
  --paper:#e8ece7; --card:#f7f8f4; --card2:#eef1eb;
  --cel:#3f7f6d; --cel-d:#2c5f51; --cel-l:#d9e6e0;
  --dan:#ab3b35; --dan-l:#f3dedc;
  --ochre:#a97a26; --ochre-l:#f2e8d2;
  --sea:#2f7183;
  --line:#ccd5cd; --line2:#dde3dc;
  --shadow:0 1px 2px rgba(22,35,42,.07);
  --serif:"Noto Serif SC",Songti SC,SimSun,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --topH:104px;
}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.72;-webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle at 12% 18%,rgba(63,127,109,.05) 0 1px,transparent 1px),
                   radial-gradient(circle at 68% 62%,rgba(22,35,42,.04) 0 1px,transparent 1px);
  background-size:26px 26px,34px 34px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 14px;position:relative;z-index:1}

/* ── top bar ───────────────────────── */
.top{position:sticky;top:0;z-index:40;background:rgba(232,236,231,.97);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:9px 14px 0}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-weight:700;font-size:17px;margin:0;letter-spacing:.3px}
.brand .sub{font-size:11.5px;color:var(--ink3)}
.nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;font-family:var(--sans);font-size:13.5px;color:var(--ink2);
  background:none;border:0;border-bottom:2.5px solid transparent;
  padding:6px 11px 8px;cursor:pointer;white-space:nowrap;font-weight:500;
}
.nav button .d{font-size:10.5px;color:var(--ink3);display:block;line-height:1.3;font-weight:400}
.nav button[aria-current="true"]{color:var(--cel-d);border-bottom-color:var(--cel)}
.nav button[aria-current="true"] .d{color:var(--cel)}
.nav button.today::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--dan);margin-left:4px;vertical-align:2px}

/* ── generic ───────────────────────── */
h2.sec{font-family:var(--serif);font-size:19px;font-weight:700;margin:26px 0 12px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
h3.sub{font-family:var(--serif);font-size:15.5px;font-weight:700;margin:20px 0 9px;color:var(--cel-d)}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:14px 15px;margin:11px 0;box-shadow:var(--shadow)}
.muted{color:var(--ink3);font-size:13px;line-height:1.65}
.kv{font-size:13.5px;color:var(--ink2)}
b,strong{font-weight:700;color:var(--ink)}
a{color:var(--cel-d)}

/* day head */
.dayhead{padding:16px 0 4px}
.dayhead .dh-date{font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1.2}
.dayhead .dh-date span{font-size:14px;font-weight:500;color:var(--ink3);margin-left:8px;letter-spacing:0}
.dayhead .dh-theme{font-size:15px;margin-top:3px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);white-space:nowrap}
.leanbar{display:flex;align-items:center;gap:0;margin:12px 0 4px;flex-wrap:wrap}
.segbtn{font-family:var(--sans);font-size:13px;padding:5px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.segbtn:first-of-type{border-radius:7px 0 0 7px}
.segbtn:nth-of-type(2){border-radius:0 7px 7px 0;border-left:0}
.segbtn[aria-pressed="true"]{background:var(--cel);border-color:var(--cel);color:#fff}
.leanhint{font-size:12px;color:var(--ink3);margin-left:10px}
.chip.cel{background:var(--cel-l);border-color:#b9d3c9;color:var(--cel-d)}
.chip.dan{background:var(--dan-l);border-color:#e6c3c0;color:var(--dan)}
.chip.och{background:var(--ochre-l);border-color:#e0cfa5;color:var(--ochre)}
.chip.sea{background:#d7e9ec;border-color:#a9cdd3;color:var(--sea)}

/* callout */
.note{border-left:3px solid var(--cel);background:var(--card);padding:11px 13px;border-radius:0 8px 8px 0;margin:11px 0;font-size:14px;line-height:1.7}
.note.warn{border-left-color:var(--dan);background:#fbf3f2}
.note.gold{border-left-color:var(--ochre);background:#fbf7ec}
.note .nt{font-weight:700;font-size:13px;display:block;margin-bottom:3px;letter-spacing:.3px}
.note.warn .nt{color:var(--dan)} .note .nt{color:var(--cel-d)} .note.gold .nt{color:var(--ochre)}

/* ── timeline (grid: time | axis | body) ── */
.tl{--tw:64px;--ax:26px;display:grid;grid-template-columns:var(--tw) var(--ax) 1fr;position:relative}
.tl::before{content:"";position:absolute;top:20px;bottom:20px;left:calc(var(--tw) + var(--ax)/2);width:1.5px;background:var(--line);transform:translateX(-50%)}
.tl .t-time{grid-column:1;text-align:right;padding:14px 0 0;font-size:13px;color:var(--ink3);line-height:1.45}
.tl .t-time b{display:block;font-size:13.5px;color:var(--ink2);font-weight:700}
.tl .t-ax{grid-column:2;position:relative;display:grid;justify-items:center}
.tl .dot{margin-top:14px;width:11px;height:11px;border-radius:50%;background:var(--cel);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--cel);align-self:start;justify-self:center}
.tl .dot.fix{background:var(--dan);box-shadow:0 0 0 1.5px var(--dan)}
.tl .dot.flex{background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.tl .dot.rest{background:var(--ink3);box-shadow:0 0 0 1.5px var(--ink3)}
.tl .t-body{grid-column:3;padding:8px 0 14px 4px;min-width:0}
.tl .t-row{display:contents}
.tl .t-card{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;box-shadow:var(--shadow)}
.tl .t-card.fix{border-color:#e0b8b5;background:#fcf5f4}
.tl .t-card.flex{border-style:dashed;background:var(--card2)}
.t-title{font-weight:700;font-size:15.5px;line-height:1.5;font-family:var(--serif)}
.t-desc{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.68}
.t-tip{font-size:12.5px;color:var(--ink3);margin-top:7px;line-height:1.62;padding-top:7px;border-top:1px dashed var(--line)}

/* option picker */
.opts{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{
  display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
  font-family:var(--sans);font-size:14px;color:var(--ink2);line-height:1.55;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--cel)}
.opt .mk{flex:0 0 auto;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;position:relative;background:#fff}
.opt[aria-pressed="true"]{background:var(--cel-l);border-color:var(--cel)}
.opt[aria-pressed="true"] .mk{border-color:var(--cel);background:var(--cel)}
.opt[aria-pressed="true"] .mk::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.opt[aria-pressed="true"] .on{color:var(--cel-d);font-weight:700}
.opt .on{font-weight:500;color:var(--ink)}
.opt .os{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px;line-height:1.5}
.opt .tagd{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:1.5px;font-weight:500}
.tg-def{background:var(--cel-l);color:var(--cel-d)}
.tg-risk{background:var(--dan-l);color:var(--dan)}
.tg-near{background:var(--ochre-l);color:var(--ochre)}
.tg-alt{background:#e3e7e2;color:var(--ink3)}
.optbar{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:var(--ink3)}
.optbar .lbl{font-weight:700;color:var(--cel-d);font-size:12px}

/* action buttons */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.btn{
  font-family:var(--sans);font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--ink2);display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{border-color:var(--cel);color:var(--cel-d)}
.btn svg{width:13px;height:13px;flex:0 0 auto}
.btn.pri{background:var(--cel);border-color:var(--cel);color:#fff}
.btn.pri:hover{background:var(--cel-d);color:#fff}

/* route chain */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin-top:4px}
.cnode{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;min-width:74px;box-shadow:var(--shadow)}
.cnode b{display:block;font-size:13px;font-family:var(--serif);font-weight:700}
.cnode em{font-style:normal;color:var(--ink3);font-size:11px}
.cnode.fix{border-color:#e0b8b5;background:#fcf5f4}
.cnode.fix b{color:var(--dan)}
.carw{display:flex;align-items:center;padding:0 5px;color:var(--cel);font-size:10.5px;text-align:center;line-height:1.3}
.carw u{text-decoration:none;display:block}
.carw::before{content:"→";display:block;margin-right:4px;font-size:13px;color:var(--line)}

/* gantt */
.gantt{background:var(--card);border:1px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.grow{display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid var(--line2)}
.grow:last-child{border-bottom:0}
.ghd{background:var(--card2);font-size:11px;color:var(--ink3);font-weight:700}
.glbl{padding:9px 8px;font-size:12px;line-height:1.4;border-right:1px solid var(--line2)}
.glbl b{display:block;font-size:13px;font-family:var(--serif)}
.glbl em{font-style:normal;color:var(--ink3);font-size:10.5px}
.gtrack{position:relative;height:58px}
.ghours{display:grid;grid-template-columns:repeat(15,1fr);height:100%}
.ghours i{font-style:normal;border-left:1px solid #e6eae4;font-size:9.5px;color:#9fadb2;padding-left:2px}
.ghd .gtrack{height:auto}
.gbar{position:absolute;top:7px;height:20px;border-radius:4px;font-size:10.5px;line-height:20px;padding:0 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar.r2{top:31px}
.b-cul{background:#3f6f8f}.b-shop{background:#a97a26}.b-food{background:#8f3f3a}
.b-rest{background:#6b7b80}.b-fix{background:#ab3b35}.b-move{background:#6a7f99}
.b-sea{background:#2f7183}.b-cafe{background:#8a6a3c}.b-flex{background:#9aa8a2}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:10px 0 0;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* table */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;background:var(--card);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.tbl th{background:var(--card2);font-size:12px;color:var(--ink2);text-align:left;padding:8px 9px;font-weight:700;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px;border-bottom:1px solid #e7ebe5;vertical-align:top;line-height:1.6;word-break:break-word}
.tbl tr:last-child td{border-bottom:0}

/* food cards */
.filters{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.filters button{font-family:var(--sans);font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fcard{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 13px;margin:9px 0;box-shadow:var(--shadow)}
.fcard .fh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.fcard .fn{font-family:var(--serif);font-weight:700;font-size:15.5px}
.catlb{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:7px;vertical-align:2px;white-space:nowrap}
.lb-sea{background:#d7e9ec;color:var(--sea)}
.lb-meat{background:var(--dan-l);color:var(--dan)}
.lb-soup{background:#e3e9e2;color:var(--cel-d)}
.lb-cafe{background:var(--ochre-l);color:var(--ochre)}
.lb-snack{background:#e9e2d3;color:#8a6a3c}
.lblegend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.zoneh{font-family:var(--serif);font-size:16px;font-weight:700;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--cel);color:var(--cel-d);display:flex;align-items:baseline;justify-content:space-between}
.zonec{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink3)}
.fh .tagd{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-left:5px;font-weight:600;white-space:nowrap}
.fcard .fk{font-size:12.5px;color:var(--ink3);margin-top:1px;font-family:var(--sans)}
.fcard .fmeta{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.6}
.fcard .fmeta dt{color:var(--ink3);font-size:12px}
.fcard .fmeta dd{margin:0}
.warnrow{background:var(--dan-l);color:var(--dan);border-radius:6px;padding:5px 8px;font-size:12.5px;margin-top:7px;line-height:1.55}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:14px;line-height:1.62;box-shadow:var(--shadow)}
.chk .box{flex:0 0 auto;width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;margin-top:3px;background:#fff;position:relative}
.chk[aria-pressed="true"]{background:var(--card2)}
.chk[aria-pressed="true"] .box{background:var(--cel);border-color:var(--cel)}
.chk[aria-pressed="true"] .box::after{content:"";position:absolute;left:5px;top:1.5px;width:4.5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.chk[aria-pressed="true"] .ct{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.ct{text-align:left}
.ckl{display:inline-block;margin-left:8px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--cel-l);color:var(--cel-d);border:1px solid #b9d3c9;text-decoration:none;white-space:nowrap;vertical-align:1px}
.ckl:hover{background:var(--cel);color:#fff}
.chk[aria-pressed="true"] .ckl{text-decoration:none}

/* taxi overlay */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(18,28,33,.82);display:none;align-items:center;justify-content:center;padding:18px}
.ovl.on{display:flex}
.ovlbox{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px 20px;text-align:center;max-height:88vh;overflow:auto}
.ovlbox .oh{font-size:12.5px;color:var(--ink3);letter-spacing:1px}
.ovlbox .okr{font-size:27px;line-height:1.48;font-weight:700;margin:12px 0;color:#000;word-break:keep-all;font-family:var(--sans)}
.ovlbox .ocn{font-size:14px;color:var(--ink2);margin-bottom:14px}
.ovlbox .otip{font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line2);padding-top:11px;margin-top:4px;line-height:1.6}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--ink);color:#fff;font-size:13.5px;padding:9px 18px;border-radius:99px;z-index:95;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* summary bar */
.mysel{background:var(--card);border:1px dashed var(--cel);border-radius:10px;padding:12px 14px;margin:12px 0}
.mysel .msh{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--cel-d);margin-bottom:7px}
.mysel ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.85;color:var(--ink2)}
.mysel li b{color:var(--ink)}

.foot{margin:30px 0 10px;font-size:11.5px;color:var(--ink3);line-height:1.75;border-top:1px solid var(--line);padding-top:13px}

@media(max-width:600px){
  :root{--topH:100px}
  body{font-size:16px}
  .tl{--tw:58px;--ax:22px}
  .ovlbox .okr{font-size:23px}
  .glbl{padding:7px 6px}
  .grow{grid-template-columns:66px 1fr}
  .gbar{font-size:9.5px;padding:0 3px}
  .brand h1{font-size:15.5px}
  .brand .sub{font-size:12.5px}
  .nav button{font-size:14px;padding:7px 11px 9px}
  .nav button .d{font-size:12px}
  .chip{font-size:12.5px;padding:4px 10px}
  .segbtn{font-size:14px;padding:9px 18px;min-height:44px}
  .leanhint{font-size:13px;flex-basis:100%;margin:5px 0 0}
  .note{font-size:15px}
  .note .nt{font-size:14px}
  .muted,.kv{font-size:14px}
  .btn{font-size:14px;padding:10px 14px;min-height:44px}
  .filters button{font-size:14px;padding:10px 15px;min-height:44px}
  .opt{font-size:15px;padding:10px 11px}
  .opt .os{font-size:13.5px}
  .opt .tagd{font-size:12px}
  .t-desc{font-size:15px}
  .t-tip{font-size:14px}
  .tbl{font-size:14px}
  .tbl th{font-size:13.5px}
  .fcard .fk{font-size:13.5px}
  .catlb{font-size:11.5px;padding:2px 8px}
  .zoneh{font-size:16.5px}
  .fcard .fmeta{font-size:14px;grid-template-columns:48px 1fr}
  .fcard .fmeta dt{font-size:13.5px}
  .warnrow{font-size:13.5px}
  .cnode{font-size:13.5px}
  .cnode em{font-size:12.5px}
  .carw{font-size:12px}
  .legend{font-size:13px}
  .optbar,.optbar .lbl{font-size:13.5px}
  .foot{font-size:13px}
  .chk{font-size:15px;padding:12px}
  .ckl{font-size:13.5px;padding:11px 14px;min-height:44px;line-height:22px;display:inline-flex;align-items:center;margin-top:4px}
  .ovlbox .oh,.ovlbox .otip{font-size:13.5px}
}
@media print{.top,.acts,.filters{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand">
      <h1>首尔五天 · 随行手册</h1>
      <span class="sub">2026/9/26–9/30 · 江南威斯汀</span>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<script>
/* ============================================================

const LS = "seoul2026.v1";
let ST = {picks:{}, done:{}, tab:"d0928"};
try{const s=JSON.parse(localStorage.getItem(LS)); if(s&&typeof s==="object"){ST=Object.assign(ST,s);}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1900);}

/* 今天是哪一天（行程内才高亮） */
function todayId(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth()+1, d=n.getDate();
  if(y!==2026||m!==9) return null;
  const id=String(m).padStart(2,"0")+String(d).padStart(2,"0");
  return DAYS.some(x=>x.id===id)?id:null;
}

/* 剪贴板 */
function copy(txt){
  const done=()=>toast("已复制韩文地址");
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(()=>fb());}
  else fb();
  function fb(){
    const ta=document.createElement("textarea");ta.value=txt;
    ta.style.cssText="position:fixed;top:-999px";document.body.appendChild(ta);
    ta.select();try{document.execCommand("copy");done();}catch(e){toast("复制失败，请长按选中");}
    document.body.removeChild(ta);
  }
}

/* 给司机看 */
let ovlKr="";
function showTaxi(kr,cn){
  ovlKr=kr;$("#ovlKr").textContent=kr;$("#ovlCn").textContent=cn||"";
  $("#ovl").classList.add("on");
}
$("#ovlClose").onclick=()=>$("#ovl").classList.remove("on");
$("#ovlCopy").onclick=()=>copy(ovlKr);
$("#ovl").addEventListener("click",e=>{if(e.target.id==="ovl")$("#ovl").classList.remove("on");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#ovl").classList.remove("on");});

function naver(q){return "https://map.naver.com/p/search/"+encodeURIComponent(q);}

function renderNav(){
  const tid=todayId();
  $("#nav").innerHTML=TABS.map(t=>{
    const cur=ST.tab===t.id;
    const isToday=tid&&t.id==="d"+tid;
    return `<button data-tab="${t.id}" aria-current="${cur}" class="${isToday?"today":""}">${t.t}<span class="d">${t.d}</span></button>`;
  }).join("");
  $("#nav").querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ST.tab=b.dataset.tab;save();render();window.scrollTo({top:0});};
  });
}

/* ── 甘特 ── */
function gantt(days){
  const hrs=Array.from({length:15},(_,i)=>`<i>${i+9}</i>`).join("");
  const rows=days.map(d=>{
    const bars=d.gantt.map(([k,l,w,txt,r2])=>
      `<div class="gbar b-${k}${r2?" r2":""}" style="left:${l}%;width:${w}%">${esc(txt)}</div>`).join("");
    return `<div class="grow"><div class="glbl"><b>${d.date}</b><em>${d.dow}</em></div>
      <div class="gtrack"><div class="ghours">${hrs.replace(/<i>/g,'<i style="visibility:hidden">')}</div>${bars}</div></div>`;
  }).join("");
  return `<div class="gantt">
    <div class="grow ghd"><div class="glbl">时间轴</div><div class="gtrack"><div class="ghours">${hrs}</div></div></div>
    ${rows}</div>
    <div class="legend">
      <span><i class="sw b-cul"></i>文化</span><span><i class="sw b-shop"></i>购物</span>
      <span><i class="sw b-food"></i>正餐</span><span><i class="sw b-sea"></i>海鲜</span>
      <span><i class="sw b-cafe"></i>咖啡</span><span><i class="sw b-rest"></i>休息留白</span>
      <span><i class="sw b-move"></i>移动</span><span><i class="sw b-fix"></i>固定锚点</span>
      <span><i class="sw b-flex"></i>可砍弹性位</span>
    </div>
    <p class="muted" style="margin-top:8px">横轴为当日 09:00–24:00，色块长度代表实际停留时长，<b>空白就是留白</b>。虚线框与灰色块都是「可砍不影响主线」的部分。</p>`;
}

/* ── 动线链 ── */
function chain(arr){
  return `<div class="chain">`+arr.map(x=>x.a
    ? `<div class="carw"><u>${esc(x.a)}</u></div>`
    : `<div class="cnode${x.f?" fix":""}"><b>${esc(x.n)}</b><em>${esc(x.s||"")}</em></div>`).join("")+`</div>`;
}

function pickName(d,kind,ord){

    <div class="t-tip">把手机调到最亮给司机看。地铁站内、商场里信号弱时，这几个地址仍然能显示——页面已缓存在本地。</div></div>
    <h2 class="sec">紧急联络</h2>
    <table class="tbl"><colgroup><col style="width:34%"><col style="width:26%"><col style="width:40%"></colgroup>
      <thead><tr><th>用途</th><th>号码</th><th>说明</th></tr></thead><tbody>
      <tr><td>急救 / 消防</td><td><b>119</b></td><td>救护车与急诊，可要求中文协助</td></tr>
      <tr><td>报警</td><td><b>112</b></td><td></td></tr>
      <tr><td>旅游热线</td><td><b>1330</b></td><td>韩国观光公社，<b>24 小时中文服务</b>，可帮忙打电话给餐厅确认营业</td></tr>
      <tr><td>中国驻韩使馆领保</td><td>+82-2-755-0473</td><td>护照丢失等领事保护事项</td></tr>
    </tbody></table>
    <p class="muted" style="margin-top:9px"><b>1330 很好用</b>：餐厅电话打不通、不确定今天是否营业、想让人用韩语代为确认，都可以直接打这个号。</p>`;
}

/* ============================================================
   主渲染
   ============================================================ */
function render(){
  renderNav();
  const v=$("#view"); const t=ST.tab;
  if(t==="overview") v.innerHTML=renderOverview();
  else if(t==="food") v.innerHTML=renderFood();
  else if(t==="prep") v.innerHTML=renderPrep();
  else if(t==="sos") v.innerHTML=renderSos();
  else{
    const d=DAYS.find(x=>"d"+x.id===t);
    v.innerHTML=d?renderDay(d):renderOverview();
  }
  v.insertAdjacentHTML("beforeend",
    `<div class="foot"><p style="margin:0 0 5px">内容整理自《首尔 5 天父母同行慢节奏路书》。营业时间与价格来自公开渠道多源交叉，标注「未核实」的字段请出行前自行复查。</p>
     <p style="margin:0 0 5px"><b>9/26–9/27 在秋夕连假窗口内，务必逐家电话确认。</b></p>
     <p style="margin:0">本页所有选择保存在本机浏览器，离线也能打开。</p></div>`);
  bind();
}

function bind(){
  document.querySelectorAll("[data-pick]").forEach(b=>{
    b.onclick=()=>{ST.picks[b.dataset.pick]=+b.dataset.i;save();render();};
  });
  document.querySelectorAll("[data-taxi]").forEach(b=>{
    b.onclick=()=>showTaxi(b.dataset.taxi,b.dataset.taxicn);
  });
  document.querySelectorAll("[data-fzone]").forEach(b=>{
    b.onclick=()=>{ST.fzone=b.dataset.fzone;save();render();window.scrollTo({top:0});};
  });
  document.querySelectorAll("[data-chk]").forEach(b=>{
    b.onclick=()=>{const k=b.dataset.chk;ST.done[k]=!ST.done[k];save();render();};
  });
  document.querySelectorAll("[data-lean]").forEach(b=>{
    b.onclick=()=>{ST.lean=(b.dataset.lean==="1");save();render();};
  });
}

/* 启动：如果今天在行程内，默认打开今天 */
(function init(){
  const tid=todayId();
  if(tid&&!sessionStorage.getItem("seoul.opened")){ST.tab="d"+tid;sessionStorage.setItem("seoul.opened","1");}
  render();
})();
</script>
</body>
</html>
